<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель — Загрузка отчетов</title>
    <style>
        body { background: #121217; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .login-box { margin-top: 100px; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #0055FF; color: white; cursor: pointer; }
        button:hover { background: #00AA55; }
        .hidden { display: none; }
        
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        
        /* Стиль для картинки и крестика */
        .image-wrapper {
            position: relative;
            display: inline-block;
        }
        .image-wrapper img { 
            max-width: 200px; 
            border-radius: 8px; 
            border: 2px solid #00AA55; 
            display: block;
            cursor: pointer;
        }
        .delete-btn {
           position: absolute;
           top: 5px;
           right: 5px;
           background: red;
           color: white;
           border: none;
           border-radius: 50%;
    
           /* ЖЕСТКИЕ РАЗМЕРЫ, ЧТОБЫ НЕ РАСПОЛЗАЛСЯ */
           width: 25px !important;
           height: 25px !important;
           padding: 0 !important;
           font-size: 16px !important;
           line-height: 25px !important;
           text-align: center;
           cursor: pointer;
           display: none;
           z-index: 10; /* Чтобы был поверх картинки */
        }
        .image-wrapper:hover .delete-btn {
            display: block; /* Появляется при наведении на фото */
        }
    </style>
</head>
<body>

    <!-- Блок входа (пароль) -->
    <div id="loginBlock" class="login-box">
        <h2>Вход для Создателя</h2>
        <p>Введите пароль:</p>
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button onclick="login()">Войти</button>
    </div>

    <!-- Блок админки (скрыт до входа) -->
    <div id="adminBlock" class="hidden">
        <h2>Загрузка отчетов</h2>
        <p>Нажмите «+», чтобы добавить фото. Наведите на фото, чтобы удалить.</p>
        
        <!-- Кнопка + (загрузка файла) -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="addImage(event)">
        <button onclick="document.getElementById('fileInput').click()" style="font-size: 24px; padding: 10px 20px;">+</button>
        
        <div id="gallery" class="gallery"></div>
    </div>

    <script>
        const ADMIN_PASSWORD = "TFlEsLaAqApP"; 

        function login() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('loginBlock').classList.add('hidden');
                document.getElementById('adminBlock').classList.remove('hidden');
                loadGallery();
            } else {
                alert("Неверный пароль!");
            }
        }

        function addImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                let images = JSON.parse(localStorage.getItem('volna_reports') || '[]');
                images.push(imageUrl);
                localStorage.setItem('volna_reports', JSON.stringify(images));
                loadGallery();
                // Очищаем input, чтобы можно было загрузить ту же картинку снова
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // Отображение галереи с кнопкой удаления
        function loadGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            let images = JSON.parse(localStorage.getItem('volna_reports') || '[]');
            
            images.forEach((imgSrc, index) => {const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';

                const img = document.createElement('img');
                img.src = imgSrc;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.title = "Удалить фото";
                
                // Обработчик удаления
                delBtn.onclick = function() {
                    if (confirm("Удалить это фото?")) {
                        images.splice(index, 1); // Удаляем из массива
                        localStorage.setItem('volna_reports', JSON.stringify(images)); // Сохраняем
                        loadGallery(); // Перерисовываем
                    }
                };

                wrapper.appendChild(img);
                wrapper.appendChild(delBtn);
                gallery.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
